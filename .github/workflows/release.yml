# Baut bei einem Versionsschild v… das .deb (ein Paket für Ubuntu 24.04/26.04 und Debian 12/13,
# gebaut in einem Debian-12-Container, damit die glibc-Anforderung niedrig bleibt) und legt ein
# Release mit tagjoe_<version>_amd64.deb und SHA256SUMS an (Namensschema der Updatefunktion und
# von install.sh). Vorbild: tvjoe/.github/workflows/release.yml.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debian12:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container: debian:12
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Systempakete
        timeout-minutes: 30
        run: |
          for i in 1 2 3; do
            if timeout 300 apt-get update \
              && timeout 480 apt-get install -y ca-certificates curl git build-essential \
                pkg-config dpkg-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
                libxcb1-dev libxcb-xkb-dev; then
              exit 0
            fi
            echo "Systempakete: Versuch $i fehlgeschlagen, neuer Versuch"
            dpkg --configure -a || true
            sleep 20
          done
          exit 1
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Tests
        run: cargo test --locked --workspace
      - name: Paket bauen
        run: TAGJOE_OUT=dist tools/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb

  release:
    needs: [debian12]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deb
          path: dist
      - name: Prüfsummen
        run: cd dist && sha256sum *.deb > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/SHA256SUMS
