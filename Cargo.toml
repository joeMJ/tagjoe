[workspace]
resolver = "3"
members = ["crates/tagjoe-core", "crates/tagjoe"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"
repository = "https://github.com/joeMJ/tagjoe"

[workspace.dependencies]
lofty = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "gzip"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
